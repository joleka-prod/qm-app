# Spielt neue Migrationen und alle Edge Functions automatisch ein:
#   Push auf Branch "test" -> Testsystem, Push auf "main" -> Livesystem.
# Benötigte GitHub-Secrets: SUPABASE_ACCESS_TOKEN, LIVE_DB_URL, TEST_DB_URL
# (Verbindungsadressen jeweils "Session pooler" aus Supabase -> Connect).
name: Supabase einspielen

on:
  push:
    branches: [main, test]
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  einspielen:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_name == 'test'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_URL: ${{ github.ref_name == 'main' && secrets.LIVE_DB_URL || secrets.TEST_DB_URL }}
      PROJECT_REF: ${{ github.ref_name == 'main' && 'zcsinntrwaqmidyenuee' || 'lxpvlybhkmmaeqfnimps' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prüfen, ob die Migrationsliste geführt wird
        # Solange die per Hand ausgeführten Migrationen nicht als gelaufen markiert sind,
        # würde "db push" alle 88 noch einmal ausführen. Dann lieber abbrechen.
        run: |
          n=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          echo "Bereits eingetragene Migrationen: $n"
          if [ "$n" = "0" ]; then
            echo "::error::Die Datenbank hat noch keine Migrationsliste. Zuerst den Workflow 'Live: Migrationen als gelaufen markieren' ausführen."
            exit 1
          fi

      - name: Neue Migrationen einspielen
        run: supabase db push --db-url "$DB_URL" --yes

      - name: Edge Functions deployen
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
